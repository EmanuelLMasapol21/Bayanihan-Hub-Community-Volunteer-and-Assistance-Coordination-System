<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayanihan Hub - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="card p-4 shadow-sm" style="max-width: 450px; width: 100%;">
        <h2 class="text-center mb-4">Create Account</h2>

        <form action="register.php" method="POST">
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" name="full_name" placeholder="e.g. Juan Dela Cruz" required>
            </div>

            <div class="mb-3">
                <label for="regEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="regEmail" name="email" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
                <label for="userRole" class="form-label">I want to register as:</label>
                <select class="form-select" id="userRole" name="role" required>
                    <option value="" selected disabled>Choose your role...</option>
                    <option value="volunteer">Volunteer (Join community & help)</option>
                    <option value="resident">Resident (Request assistance & relief)</option>
                    <option value="admin">Admin / LGU Coordinator</option>
                </select>
            </div>

            <div class="mb-3 d-none" id="adminKeyContainer">
                <label for="adminKey" class="form-label text-danger fw-bold">Admin Security Key</label>
                <input type="password" class="form-control border-danger" id="adminKey" name="admin_key" placeholder="Enter authorization key">
                <div class="form-text text-danger">Secret key required to register as an Admin.</div>
            </div>

            <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="regPassword" name="password" required>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create Account</button>

            <div class="text-center mt-3">
                <span class="small text-muted">Already have an account?</span>
                <a href="Login.html" class="small text-decoration-none fw-bold ms-1">Login here</a>
            </div>
        </form>
    </div>
